    <div class="topbar">
        <div class="logo_group">
            <img class="logo" src="{{ doc_root }}logo_small.png">
        </div>
        <div class="permalink_list">
            {% for link in permalinks %}
            <a class="permalink" href="{{ link.href }}">{{ link.title }}</a>
            {% endfor %}
        </div>
        <div class="title_group">
            <div class="title-deco title-deco-left">✧ ﾟ ✧ ﾟ</div>
            <div class="title">{{ title }}</div>
            <div class="title-deco title-deco-right">ﾟ ✧ ﾟ ✧</div>
            <div class="title_stars">
                <span class="star star-1">☆</span>
                <span class="star star-2">★</span>
                <span class="star star-3">☆</span>
            </div>
        </div>
    </div>
